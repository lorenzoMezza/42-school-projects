[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "bm25s>=0.3.13",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "pystemmer>=3.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.mypy]
exclude = ["^data/", "^\\.venv/"]

# CPU-only PyTorch: the evaluation machines have no GPU, and the default
# Linux wheels pull several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
